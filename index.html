<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command Center</title>
  <style>
    /* ---------- Reset & Base ---------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', Courier, monospace;
      background: #0b0c1b;
      color: #00eaff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      flex-direction: column;
    }

    /* ---------- Command Center Header ---------- */
    .header {
      font-size: 3rem;
      position: relative;
      color: #00eaff;
      text-transform: uppercase;
      letter-spacing: 2px;
      animation: flicker 2s infinite;
    }

    /* Typing effect container */
    .typed-text::after {
      content: '|';
      animation: blink 0.7s infinite;
    }

    /* ---------- Glitch Effect ---------- */
    @keyframes flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        text-shadow: 0 0 2px #00eaff, 0 0 5px #ff007f;
      }
      20%, 22%, 24%, 55% {
        text-shadow: 0 0 20px #00eaff, 0 0 30px #ff007f;
      }
    }

    /* Typing Blink */
    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0; }
    }

    /* ---------- Layout ---------- */
    .container {
      text-align: center;
      padding: 1rem;
      max-width: 1200px;
      width: 90%;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 768px) {
      .header { font-size: 2rem; }
    }
    @media (max-width: 480px) {
      .header { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="header typed-text" id="commandCenter"></h1>
  </div>

  <script>
    // ---------- Typing Effect ----------
    const text = "COMMAND CENTER";
    const speed = 150; // typing speed
    let i = 0;

    function typeWriter() {
      if (i < text.length) {
        document.getElementById("commandCenter").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, speed);
      }
    }
    window.onload = typeWriter;
  </script>
</body>
</html>
